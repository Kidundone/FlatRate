<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Flat-Rate Tracker — Welcome</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flat-Rate">
  <link rel="stylesheet" href="./app.2fe4c2face.css">
  <style>
    .cb-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100dvh - 60px);
      padding: 32px 24px;
      text-align: center;
      max-width: 420px;
      margin: 0 auto;
    }
    .cb-icon { font-size: 52px; margin-bottom: 18px; line-height: 1; }
    .cb-title { font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -.3px; }
    .cb-sub { color: var(--muted); font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
    .cb-steps {
      width: 100%;
      background: var(--card-bg, #1c1c1e);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 4px 0;
      margin-bottom: 28px;
      text-align: left;
    }
    .cb-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--stroke);
    }
    .cb-step:last-child { border-bottom: none; }
    .cb-step-num {
      color: var(--primary);
      font-weight: 700;
      font-size: 15px;
      min-width: 20px;
      padding-top: 1px;
    }
    .cb-step-text { font-size: 14px; line-height: 1.45; }
    .cb-step-text strong { color: #fff; font-weight: 600; }
    .cb-cta {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
    }
    .cb-redirect { margin-top: 14px; font-size: 12px; color: var(--muted); }
    .cb-spin {
      width: 36px;
      height: 36px;
      border: 3px solid var(--stroke2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="top">
    <div class="topRow">
      <div class="topTitle">Flat-Rate</div>
    </div>
  </header>

  <div class="cb-body" id="cbContent">
    <div class="cb-spin"></div>
    <div class="cb-title">Confirming your account…</div>
    <div class="cb-sub">Hang on just a second.</div>
  </div>

  <script>
    window.__SUPABASE_CONFIG__ = {
      url: "https://lfnydhidbwfyfjafazdy.supabase.co",
      anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmbnlkaGlkYndmeWZqYWZhemR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzNTk0MDYsImV4cCI6MjA4MzkzNTQwNn0.ES4tEeUgtTrPjYR64SGHDeQJps7dFdTmF7IRUhPZwt4"
    };
  </script>
  <script src="./vendor/supabase.js"></script>
  <script>
    (function () {
      const cfg = window.__SUPABASE_CONFIG__;
      const client = window.supabase.createClient(cfg.url, cfg.anonKey);
      const el = document.getElementById("cbContent");
      let settled = false;
      // Checked synchronously from the URL itself (Supabase puts
      // type=recovery in the hash or query string) rather than relying on
      // the PASSWORD_RECOVERY auth event alone — event timing vs. the
      // getSession() promise isn't guaranteed, and a race there would let
      // "You're in!" render first and lock out the actual reset form.
      let isRecovery = /type=recovery/.test(window.location.hash) || /type=recovery/.test(window.location.search);

      // A password-reset link lands here the same way a signup-confirmation
      // link does (both hand back a session) — without this branch, someone
      // resetting their password saw "You're in! Follow these steps…" with
      // no way to actually set a new password. onAuthStateChange fires
      // PASSWORD_RECOVERY specifically for this case, ahead of the generic
      // SIGNED_IN handling below.
      function showRecoveryForm() {
        if (settled) return;
        settled = true;
        el.innerHTML = `
          <div class="cb-icon">🔑</div>
          <div class="cb-title">Set a new password</div>
          <div class="cb-sub">Choose a new password for your account.</div>
          <div style="width:100%;text-align:left;">
            <input id="newPw" type="password" placeholder="New password (min 6 characters)"
              autocomplete="new-password"
              style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--stroke2, #333);background:var(--surface2,#242427);color:#fff;font-size:15px;margin-bottom:10px;box-sizing:border-box;" />
            <input id="newPw2" type="password" placeholder="Confirm new password"
              autocomplete="new-password"
              style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--stroke2, #333);background:var(--surface2,#242427);color:#fff;font-size:15px;margin-bottom:14px;box-sizing:border-box;" />
            <div id="pwErr" style="color:#ed4956;font-size:13px;margin-bottom:12px;display:none;"></div>
            <button id="pwSaveBtn" type="button" class="btn primary cb-cta">Save new password</button>
          </div>
        `;
        const pw1 = document.getElementById("newPw");
        const pw2 = document.getElementById("newPw2");
        const err = document.getElementById("pwErr");
        const btn = document.getElementById("pwSaveBtn");
        const showErr = (msg) => { err.textContent = msg; err.style.display = ""; };
        const submit = async () => {
          err.style.display = "none";
          const a = pw1.value, b = pw2.value;
          if (!a || a.length < 6) return showErr("Password must be at least 6 characters.");
          if (a !== b) return showErr("Passwords don't match.");
          btn.disabled = true;
          btn.textContent = "Saving…";
          const { error } = await client.auth.updateUser({ password: a });
          if (error) {
            btn.disabled = false;
            btn.textContent = "Save new password";
            return showErr(error.message);
          }
          settled = false; // allow showSuccess to render over this
          el.innerHTML = `
            <div class="cb-icon">✅</div>
            <div class="cb-title">Password updated</div>
            <div class="cb-sub">You're signed in with your new password.</div>
            <a class="btn primary cb-cta" href="./index.html">Continue to the app</a>
          `;
          settled = true;
        };
        btn.addEventListener("click", submit);
        pw2.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      }

      function showSuccess(session) {
        if (isRecovery) return; // recovery flow owns the screen once triggered
        if (settled) return;
        settled = true;
        const email = session?.user?.email || "";
        const name  = email ? email.split("@")[0] : "";
        el.innerHTML = `
          <div class="cb-icon">✅</div>
          <div class="cb-title">You're in${name ? ", " + name : ""}!</div>
          <div class="cb-sub">Account confirmed. Follow these steps to get started:</div>
          <div class="cb-steps">
            <div class="cb-step">
              <div class="cb-step-num">1</div>
              <div class="cb-step-text">When prompted, enter your <strong>Employee #</strong> and <strong>Hourly Rate</strong></div>
            </div>
            <div class="cb-step">
              <div class="cb-step-num">2</div>
              <div class="cb-step-text">Log your first flat-rate job — RO # and hours worked</div>
            </div>
            <div class="cb-step">
              <div class="cb-step-num">3</div>
              <div class="cb-step-text">Your data syncs automatically across all your devices</div>
            </div>
          </div>
          <a class="btn primary cb-cta" href="./index.html">Get Started</a>
          <div class="cb-redirect">Redirecting automatically in 5 seconds…</div>
        `;
        setTimeout(function () { window.location.replace("./index.html"); }, 5000);
      }

      function showExpired() {
        if (settled) return;
        settled = true;
        el.innerHTML = `
          <div class="cb-icon" style="font-size:44px;">⚠️</div>
          <div class="cb-title">Link expired or already used</div>
          <div class="cb-sub">This confirmation link may have expired. Sign in with your email and password — your account is ready.</div>
          <a class="btn primary cb-cta" href="./index.html">Go to Sign In</a>
        `;
      }

      // Known from the URL already — show the form right away rather than
      // waiting on the PASSWORD_RECOVERY event. Supabase's client detects
      // and establishes the recovery session from the URL on init
      // (detectSessionInUrl), so updateUser() below works regardless.
      if (isRecovery) showRecoveryForm();

      // onAuthStateChange fires SIGNED_IN when the hash tokens are processed,
      // or PASSWORD_RECOVERY specifically when the link came from a
      // "reset your password" email — kept as a safety net in case the URL
      // check above ever misses a variant Supabase uses for this.
      client.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY") {
          isRecovery = true;
          showRecoveryForm();
          return;
        }
        if (session && !isRecovery) showSuccess(session);
      });

      // getSession triggers hash processing in Supabase v2; also covers direct navigation
      client.auth.getSession().then(function (r) {
        if (isRecovery) return;
        if (r.data && r.data.session) {
          showSuccess(r.data.session);
        } else {
          // Give onAuthStateChange a moment to fire before showing the error
          setTimeout(function () { if (!settled) showExpired(); }, 3500);
        }
      });
    })();
  </script>

</body>
</html>
