<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Page Not Found — Flat-Rate Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #07070f; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; padding: 32px 24px; text-align: center;
    }
    .logo {
      font-size: 11px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: #22c55e; margin-bottom: 40px;
    }
    .code { font-size: 80px; font-weight: 900; line-height: 1; color: rgba(255,255,255,.06); }
    .title { font-size: 22px; font-weight: 700; margin-top: -8px; }
    .sub { font-size: 14px; color: rgba(255,255,255,.5); margin-top: 10px; max-width: 280px; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 32px;
      background: #22c55e; color: #000; font-size: 15px; font-weight: 700;
      padding: 12px 28px; border-radius: 999px; text-decoration: none;
    }
    a:active { opacity: .85; }
  </style>
</head>
<body>
  <div class="logo">Flat-Rate Tracker</div>
  <div class="code">404</div>
  <div class="title">Page not found</div>
  <p class="sub">That URL doesn't exist. Head back to the app.</p>
  <a href="/">Back to App</a>
</body>
</html>
